name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  # Builds real app images and runs upstream's tests and exploits against them.
  # The full set of reference apps (scripts/score_reference_apps.py) takes over
  # half an hour, so CI runs the Flask end-to-end tests and the patch checks.
  docker:
    runs-on: ubuntu-latest
    env:
      RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest tests/test_scorer.py tests/test_env_patches.py tests/test_scenario_patches.py
