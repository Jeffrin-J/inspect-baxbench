[project]
name = "inspect-baxbench"
version = "0.1.0"
description = "Inspect implementation of BaxBench: can LLMs generate correct and secure backends?"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jeffrin-J", email = "63340986+Jeffrin-J@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "docker>=7.2.0",
    "imageio>=2.38.1",
    "inspect-ai>=0.3.285",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
