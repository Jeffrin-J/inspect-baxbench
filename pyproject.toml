[project]
name = "inspect-baxbench"
version = "0.1.0"
description = "Inspect implementation of BaxBench: can LLMs generate correct and secure backends?"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jeffrin-J", email = "63340986+Jeffrin-J@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "docker>=7.2.0",
    "imageio>=2.38.1",
    "inspect-ai>=0.3.285",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "openai>=3.41.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
# tests/apps holds hand-written apps for the benchmark's own frameworks; some
# are deliberately insecure. scenarios.py is generated by scripts/generate_scenarios.py.
extend-exclude = ["reference", "tests/apps", "src/inspect_baxbench/scenarios.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Line length is left to the formatter; long strings are upstream's exact prompt text.
ignore = ["E501"]

[tool.mypy]
files = ["src", "tests", "scripts"]
exclude = ["^tests/apps/"]
strict = true
mypy_path = "src"
explicit_package_bases = true
# Upstream BaxBench is imported by top-level name at run time (see upstream.py).
[[tool.mypy.overrides]]
module = ["cwes", "env", "env.*", "prompts", "scenarios", "scenarios.*", "docker", "docker.*", "datasets"]
ignore_missing_imports = true

# Test functions need no annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
